name: splitlui
description: Playful group expenses and travel budgets.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  intl: any
  share_plus: ^11.1.0
  pdf: ^3.11.3
  printing: ^5.14.3
  cross_file: ^0.3.4+2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  google_mlkit_text_recognition: ^0.15.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  generate: true
  uses-material-design: true
  assets:
    - config/supabase.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#E8FAF6"
  adaptive_icon_foreground: "assets/icons/app_icon_tran.png"
